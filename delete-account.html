<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify & Delete Account</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: #f8fafc;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 480px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }
    p {
      color: #cbd5e1;
      line-height: 1.5;
      margin: 0 0 16px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #020617;
      color: white;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      background: #38bdf8;
      color: #082f49;
    }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .status {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #1e293b;
      min-height: 48px;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .status.success { border-left: 4px solid #22c55e; }
    .status.error { border-left: 4px solid #ef4444; }
    .muted { color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Verify & Delete Account</h1>
    <p>Enter the user ID to verify the account before deleting it.</p>

    <form id="verifyForm">
      <label for="userId">User ID</label>
      <input id="userId" name="userId" placeholder="Enter user ID" required />
      <div class="actions">
        <button type="submit" class="btn-primary">Verify account</button>
      </div>
    </form>

    <div class="status" id="verifyStatus">Waiting for verification…</div>

    <hr style="margin: 20px 0; border-color: rgba(148,163,184,0.2);" />

    <div class="muted">This action permanently removes the user account and related records.</div>
    <div class="actions" style="margin-top: 12px;">
      <button type="button" class="btn-danger" id="deleteBtn">Delete account</button>
    </div>
  </div>

  <script>
    const verifyForm = document.getElementById('verifyForm');
    const verifyStatus = document.getElementById('verifyStatus');
    const deleteBtn = document.getElementById('deleteBtn');
    const userIdInput = document.getElementById('userId');

    function setStatus(message, type = '') {
      verifyStatus.textContent = message;
      verifyStatus.className = `status ${type}`.trim();
    }

    verifyForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const userId = userIdInput.value.trim();
      if (!userId) {
        setStatus('Please enter a user ID.', 'error');
        return;
      }

      setStatus('Checking account…');
      try {
        const response = await fetch('/auth/verify-account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });

        const data = await response.json();
        if (!response.ok) {
          setStatus(data?.error?.message || 'Verification failed.', 'error');
          return;
        }

        setStatus(`Account found:\nUser: ${data?.data?.userName || 'N/A'}\nEmail: ${data?.data?.email || 'N/A'}`, 'success');
      } catch (error) {
        setStatus(`Request failed: ${error.message}`, 'error');
      }
    });

    deleteBtn.addEventListener('click', async () => {
      const userId = userIdInput.value.trim();
      if (!userId) {
        setStatus('Please enter a user ID before deleting.', 'error');
        return;
      }

      const confirmed = window.confirm(`Delete account for ${userId}? This cannot be undone.`);
      if (!confirmed) {
        return;
      }

      setStatus('Deleting account…');
      try {
        const response = await fetch('/auth/delete-account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });

        const data = await response.json();
        if (!response.ok) {
          setStatus(data?.error?.message || 'Delete request failed.', 'error');
          return;
        }

        setStatus(`Account deleted successfully for ${userId}.`, 'success');
      } catch (error) {
        setStatus(`Delete request failed: ${error.message}`, 'error');
      }
    });
  </script>
</body>
</html>
